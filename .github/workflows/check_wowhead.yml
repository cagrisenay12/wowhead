name: WoW Forever Updater

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-updater:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        working-directory: ./wowhead-bot
        run: pip install -r requirements.txt

      - name: Botu Çalıştır
        working-directory: ./wowhead-bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      - name: Son Durumu Kaydet (Git Commit)
        working-directory: ./wowhead-bot
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add last_forever_id.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Son okunan id güncellendi" && git push)
